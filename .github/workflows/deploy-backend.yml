name: Deploy Backend

on:
  push:
    branches: [main]
    paths: ['backend/**']

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to ACR
        uses: azure/docker-login@v2
        with:
          login-server: catmsregistry.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push
        run: |
          cd backend
          docker build -t catmsregistry.azurecr.io/catms-backend:${{ github.sha }} .
          docker push catmsregistry.azurecr.io/catms-backend:${{ github.sha }}

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: catms-backend
          images: catmsregistry.azurecr.io/catms-backend:${{ github.sha }}
          publish-profile: ${{ secrets.AZURE_BACKEND_PUBLISH_PROFILE }}