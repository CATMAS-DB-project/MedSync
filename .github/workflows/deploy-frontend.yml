name: Deploy Frontend

on:
  push:
    branches: [main]
    paths: ['frontend/**']

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to ACR
        uses: azure/docker-login@v2
        with:
          login-server: catmsregistry.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push
        run: |
          cd frontend
          docker build \
            --build-arg VITE_API_BASE_URL=https://catms-backend.azurewebsites.net/api/v1 \
            -t catmsregistry.azurecr.io/catms-frontend:${{ github.sha }} .
          docker push catmsregistry.azurecr.io/catms-frontend:${{ github.sha }}

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: catms-frontend
          images: catmsregistry.azurecr.io/catms-frontend:${{ github.sha }}
          publish-profile: ${{ secrets.AZURE_FRONTEND_PUBLISH_PROFILE }}