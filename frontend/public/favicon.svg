<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    
    <!-- Medical Cross Gradient -->
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C6FF"/>
      <stop offset="100%" stop-color="#0072FF"/>
    </linearGradient>
    
    <!-- Sync Ring Gradient -->
    <linearGradient id="ringGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Soft Glow Filter for Logo Mark -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComponentTransfer in="blur" result="glow1">
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base (App Icon Style) -->
  <rect width="480" height="480" fill="url(#bgGrad)" rx="48"/>

  <!-- Center Logo Mark -->
  <g filter="url(#glow)">
    <!-- Orbital Sync Ring (3 Segments) -->
    <circle 
      cx="240" 
      cy="170" 
      r="90" 
      stroke="url(#ringGrad)" 
      stroke-width="14" 
      stroke-dasharray="130 58.49" 
      stroke-linecap="round" 
      fill="none" 
      transform="rotate(-90 240 170)"
    />

    <!-- Medical Cross (Vertical) -->
    <rect x="222" y="110" width="36" height="120" rx="10" fill="url(#crossGrad)"/>
    
    <!-- Medical Cross (Horizontal) -->
    <rect x="180" y="152" width="120" height="36" rx="10" fill="url(#crossGrad)"/>
  </g>

  <!-- Typography: Brand Name -->
  <text 
    x="240" 
    y="350" 
    font-family="'Inter', 'Segoe UI', -apple-system, sans-serif" 
    font-size="48" 
    font-weight="800" 
    fill="#F8FAFC" 
    text-anchor="middle">
    Med<tspan font-weight="300" fill="#34D399">Sync</tspan>
  </text>

  <!-- Typography: Subtitle -->
  <text 
    x="240" 
    y="390" 
    font-family="'Inter', 'Segoe UI', -apple-system, sans-serif" 
    font-size="14" 
    font-weight="600" 
    fill="#94A3B8" 
    text-anchor="middle" 
    letter-spacing="4">
    HOSPITAL MANAGEMENT
  </text>
</svg>
